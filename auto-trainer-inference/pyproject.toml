[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["autotrainer"]
namespaces = true

[project]
name = "auto-trainer-inference"
version = "1.0.0"
description = "Network implementations for autotrainer"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "deeplabcut",
    "tensorflow",
    "auto-trainer-core"
]
