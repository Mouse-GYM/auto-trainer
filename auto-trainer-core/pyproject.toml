[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["autotrainer"]
namespaces = true

[project]
name = "auto-trainer-core"
version = "1.0.0"
description = "Core objects and implementations for autotrainer"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    # present in requirements.txt file(s)
    # "events >= 0.5, < 1",
    # "numpy >= 1.24, < 2",
    # "pyhumps >= 3.8, < 4",
    "verboselogs >= 1.7, < 2",
]
