[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["autotrainer"]
namespaces = true

[project]
name = "auto-trainer-core"
version = "1.0.0"
description = "Core objects and implementations for autotrainer"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "events",
    "numpy"
]
