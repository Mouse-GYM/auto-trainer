[build-system]
requires = [
    "setuptools >= 61",
    'setuptools-scm >= 9.2.2, < 10',
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["autotrainer.core", "autotrainer.core.*"]
namespaces = true

[project]
name = "auto-trainer-core"
description = "Core objects and implementations for autotrainer"
license = { text = "MIT" }
requires-python = ">=3.8, <3.13"
dynamic = ["version"]

dependencies = [

    'auto-trainer-api >= 0.12.0, < 0.13.0',

    "verboselogs >= 1.7, < 2",
    "coloredlogs >= 15, < 16",

    'events >= 0.5, < 1',   # dynamic events callback handling
    'transitions >= 0.9.2, < 1',  # machine state transition handling
    'psutil >= 7, < 8',  # for free disk space, notably

    'numpy >= 1.23.5, < 2',

    'pyhumps >= 3.8, < 4',  # snake/camel case converter
    'pyyaml >= 6.0.2, < 7',
    'dacite >= 1.9, < 2',  # dict tools, used for nested instantiate dataclasses from nested dict.

    "typing-extensions >= 4.0",
]

[project.optional-dependencies]
test = [
    "pytest >= 8.2, < 9",
    "pytest-mock >= 3, < 4",
    "pytest-random-order >= 1.1, < 2",
]

[tool.setuptools_scm]
version_file = "src/autotrainer/core/_version.py"
search_parent_directories = true

[tool.setuptools_scm.scm.git]
describe_command = "git describe --tags --dirty --match 'core-v*' --abbrev=8"

[tool.pytest.ini_options]
addopts = "-p autotrainer.core.testing --random-order --random-order-bucket=global"
testpaths = ["tests"]
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(threadName)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.pyright]
pythonVersion = "3.8"
