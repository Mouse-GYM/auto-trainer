[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["autotrainer"]
namespaces = true

[project]
name = "auto-trainer-video"
version = "1.0.0"
description = "Video library for autotrainer"
license = { text = "MIT" }
