[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["autotrainer"]
namespaces = true

[project]
name = "auto-trainer-behavior"
version = "1.0.0"
description = "Behavior model implementations for autotrainer"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "transitions"
]
