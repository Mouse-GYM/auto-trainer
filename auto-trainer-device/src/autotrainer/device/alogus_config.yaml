magnet:
  head:
    min_pos: 10
    max_pos: 110
    min_pwm: 900
    max_pwm: 2100
    max_vel: 200.0
    max_acc: 100.0
pellet:
  load:
    min_pos: 0
    max_pos: 100
    min_pwm: 900
    max_pwm: 2100
    max_vel: 200.0
    max_acc: 100.0
  barrier:
    min_pos: 0
    max_pos: 120
    min_pwm: 900
    max_pwm: 2100
    max_vel: 200.0
    max_acc: 100.0
  x:
    min_step_inverse: 8
    steps_per_revolution: 48.0
    max_vel: 20.0
    max_acc: 1000.0
  y:
    min_step_inverse: 8
    steps_per_revolution: 48.0
    max_vel: 20.0
    max_acc: 1000.0
  z:
    min_step_inverse: 8
    steps_per_revolution: 48.0
    max_vel: 20.0
    max_acc: 1000.0
  actions:
    load:
      - type: load
        value: 100.0
      - type: delay
        value: 1.0
      - type: z
      value: 5.0
      - type: load
        value: 0.0
      - type: delay
        value: 1.0
      - type: z
        value: 0.0
      - type: delay
        value: 1.0
    home:
      - type: x
        value: 0.0
      - type: y
        value: 0.0
      - type: z
        value: 0.0
    send:
      - type: z
      value: .5
      - type: x
      value: -1.6
      - type: y
      value: 2.0
