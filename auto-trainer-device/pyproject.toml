[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["autotrainer"]
namespaces = true

[project]
name = "auto-trainer-device"
version = "1.0.0"
description = "Device implementations for autotrainer"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "pyserial"
]
